<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéBot test runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before the page is drawn
  try {
    const theme = localStorage.getItem("theme");
    if (theme) document.documentElement.dataset.theme = theme;
  } catch (error) {}
</script>
<style>
  :root {
    --ink: #1b2433;
    --ink-soft: #5a6577;
    --paper: #eef2f7;
    --panel: #ffffff;
    --frame: #3b4a6b;
    --frame-inner: #c9d3e3;
    --hover: #e3e9f2;
    --pass: #2e9e5b;
    --fail: #d8343f;
    --run: #3a7bd5;
    --skip: #9aa3b2;
    --ball-top: #d8343f;
    --ball-bottom: #ffffff;
    --ball-line: #1b2433;
    --pixel: "Pixelify Sans", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e6ebf3;
      --ink-soft: #9aa6b8;
      --paper: #121823;
      --panel: #1a2230;
      --frame: #7c8db5;
      --frame-inner: #2c3850;
      --hover: #232d3f;
      --pass: #4cc07f;
      --fail: #ff6670;
      --run: #6fa4f0;
      --skip: #6c7689;
      --ball-bottom: #dfe5ee;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e6ebf3;
    --ink-soft: #9aa6b8;
    --paper: #121823;
    --panel: #1a2230;
    --frame: #7c8db5;
    --frame-inner: #2c3850;
    --hover: #232d3f;
    --pass: #4cc07f;
    --fail: #ff6670;
    --run: #6fa4f0;
    --skip: #6c7689;
    --ball-bottom: #dfe5ee;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--text); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--run); outline-offset: 2px; }

  /* Panels look like the games' text boxes: a double frame */
  .box {
    background: var(--panel);
    border: 3px solid var(--frame);
    border-radius: 10px;
    box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 5px var(--frame-inner);
    padding: 16px 18px;
  }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 18px 24px; }
  header h1 { margin: 0; font: 700 26px/1 var(--pixel); letter-spacing: 0.5px; }
  header .subtitle { color: var(--ink-soft); font-size: 14px; }
  header .spacer { flex: 1; }
  .logo { width: 34px; height: 34px; flex: none; }
  .controls { display: flex; align-items: center; gap: 10px; }

  .button {
    border: 2px solid var(--frame); background: var(--panel); border-radius: 8px;
    padding: 7px 14px; cursor: pointer; font-weight: 600;
  }
  .button:hover { background: var(--hover); }
  .button.primary { background: var(--frame); color: var(--panel); }
  .button.primary:hover { filter: brightness(1.15); }
  .button.danger { border-color: var(--fail); color: var(--fail); }
  .button.wide { width: 100%; }

  .stepper { display: flex; align-items: center; border: 2px solid var(--frame); border-radius: 8px; background: var(--panel); }
  .stepper .label { padding: 0 6px 0 12px; color: var(--ink-soft); font-size: 14px; }
  .stepper button { border: 0; background: none; width: 30px; height: 34px; cursor: pointer; font-weight: 700; font-size: 17px; }
  .stepper button:hover { background: var(--hover); }
  .stepper output { min-width: 26px; text-align: center; font-weight: 700; }
  .stepper .auto { padding: 0 10px 0 4px; }

  .icon-button {
    width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid var(--frame);
    border-radius: 8px; background: var(--panel); cursor: pointer;
  }
  .icon-button:hover { background: var(--hover); }
  .icon-button svg { width: 20px; height: 20px; }
  .theme-dark { display: none; }
  :root[data-theme="dark"] .theme-dark { display: block; }
  :root[data-theme="dark"] .theme-light { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-dark { display: block; }
    :root:not([data-theme="light"]) .theme-light { display: none; }
  }

  main { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; padding: 0 24px 24px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .side { display: grid; gap: 20px; }

  .panel-title { margin: 0 0 10px; font: 700 17px/1.2 var(--pixel); }

  /* New run */
  .field { margin-bottom: 12px; }
  .field > .label { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .field input[type=text] {
    width: 100%; padding: 6px 9px; border: 2px solid var(--frame-inner); border-radius: 7px; background: var(--paper);
  }
  .choices { display: flex; flex-wrap: wrap; gap: 5px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; inset: 0; }
  .choice span {
    display: inline-block; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--frame-inner);
    cursor: pointer; font-size: 13px; user-select: none;
  }
  .choice input:checked + span { background: var(--frame); border-color: var(--frame); color: var(--panel); }
  .choice input:focus-visible + span { outline: 3px solid var(--run); outline-offset: 2px; }
  .link { border: 0; background: none; color: var(--run); cursor: pointer; padding: 0; font-size: 13px; font-weight: 400; }
  .form-error { color: var(--fail); font-size: 14px; min-height: 1.4em; margin-bottom: 6px; }

  /* Runs */
  .run-item {
    display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    padding: 8px 10px; border-radius: 7px; margin-bottom: 2px;
  }
  .run-item:hover { background: var(--hover); }
  .run-item[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--frame); }
  .run-item .name { font-weight: 600; display: block; }
  .run-item .when { color: var(--ink-soft); font-size: 13px; }
  .tally { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-top: 5px; background: var(--frame-inner); }
  .tally span { display: block; }
  .empty { color: var(--ink-soft); padding: 8px 2px; }

  /* Selected run */
  .run-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 14px; }
  .run-head h2 { margin: 0; font: 700 24px/1.2 var(--pixel); }
  .run-head .state { color: var(--ink-soft); }
  .counts { display: flex; gap: 14px; font-weight: 600; }
  .counts .pass { color: var(--pass); }
  .counts .fail { color: var(--fail); }
  .counts .skip { color: var(--ink-soft); }
  .run-head .actions { margin-left: auto; display: flex; gap: 8px; }

  .grid-wrap { overflow-x: auto; margin-bottom: 20px; }
  table.grid { border-collapse: separate; border-spacing: 6px; width: 100%; table-layout: fixed; }
  table.grid col.name { width: 150px; }
  table.grid th { font-weight: 600; text-align: left; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.grid thead th { font-size: 13px; color: var(--ink-soft); }
  table.grid tbody th { font-size: 14px; }
  td.cell {
    vertical-align: top; padding: 7px 9px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--frame-inner); background: var(--panel);
  }
  td.cell:hover { border-color: var(--frame); }
  td.cell.same { cursor: default; border-style: dashed; background: none; }
  td.cell.same:hover { border-color: var(--frame-inner); }
  td.cell[aria-selected="true"] { border-color: var(--run); }
  td.cell.failed, td.cell.lost { border-color: var(--fail); }
  td.cell .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  td.cell.failed .meta .word, td.cell.lost .meta .word { color: var(--fail); font-weight: 600; }
  td.cell.passed .meta .word { color: var(--pass); }
  td.cell.running .meta .word { color: var(--run); }

  /* One Poké Ball per state, like the party indicators in battle */
  .balls { display: flex; flex-wrap: wrap; gap: 3px; min-height: 13px; }
  .ball {
    width: 13px; height: 13px; border-radius: 50%; position: relative;
    border: 1.5px solid var(--ball-line);
    background: linear-gradient(to bottom, var(--ball-top) 0 45%, var(--ball-line) 45% 55%, var(--ball-bottom) 55% 100%);
  }
  .ball.fail { background: linear-gradient(to bottom, var(--skip) 0 45%, var(--ball-line) 45% 55%, var(--skip) 55% 100%); }
  .ball.fail::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%;
    background: linear-gradient(45deg, transparent 44%, var(--fail) 44% 58%, transparent 58%);
  }
  .ball.skip { background: none; border-style: dashed; border-color: var(--skip); }
  .ball.queued { background: none; border-color: var(--frame-inner); }
  .ball.running { background: var(--run); border-color: var(--run); animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ball.running { animation: none; } }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-soft); margin: -8px 0 16px 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .panels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 20px; align-items: start; }
  @media (max-width: 1200px) { .panels { grid-template-columns: 1fr; } }
  .failures { max-height: 460px; overflow: auto; }
  .failure { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 8px 6px; border-radius: 6px; }
  .failure:hover { background: var(--hover); }
  .failure + .failure { border-top: 1px solid var(--frame-inner); }
  .failure .state { font-weight: 600; }
  .failure .error { color: var(--fail); font-family: var(--mono); font-size: 12.5px; word-break: break-word; }
  .output-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .output-head .panel-title { margin: 0; }
  .output-head label { margin-left: auto; font-size: 13px; color: var(--ink-soft); }
  .output-meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
  pre.log {
    margin: 0; height: 460px; overflow: auto; padding: 10px 12px; border-radius: 6px;
    background: var(--paper); font: 12.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  .notice { border-color: var(--fail); color: var(--fail); margin: 0 24px 16px; }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="14" fill="var(--ball-bottom)" stroke="var(--ball-line)" stroke-width="2.5"/>
    <path d="M2 16a14 14 0 0 1 28 0Z" fill="var(--ball-top)" stroke="var(--ball-line)" stroke-width="2.5"/>
    <circle cx="16" cy="16" r="4.5" fill="var(--ball-bottom)" stroke="var(--ball-line)" stroke-width="2.5"/>
  </svg>
  <div>
    <h1>PokéBot test runner</h1>
    <div class="subtitle">Bot modes against the Master Tests states, in every game and language</div>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <div class="stepper" role="group" aria-label="Processes at the same time">
      <span class="label" id="processes-label">Processes</span>
      <button type="button" id="fewer" aria-label="Fewer processes">−</button>
      <output id="processes">8</output>
      <button type="button" id="more" aria-label="More processes">+</button>
      <button type="button" class="link auto" id="auto-processes" title="Use as many processes as this machine can take" hidden>Auto</button>
    </div>
    <button class="button primary" id="run-all">Run all</button>
    <button class="icon-button" id="theme" aria-label="Switch between light and dark theme" title="Switch theme">
      <svg class="theme-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
      </svg>
      <svg class="theme-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
      </svg>
    </button>
  </div>
</header>

<div class="box notice" id="notice" hidden></div>

<main>
  <div class="side">
    <form class="box" id="new-run" aria-labelledby="new-run-title">
      <h2 class="panel-title" id="new-run-title">New run</h2>
      <div class="field">
        <div class="label">Test files <button type="button" class="link" id="toggle-modules">Select all</button></div>
        <div class="choices" id="module-choices"></div>
      </div>
      <div class="field">
        <div class="label">Languages <button type="button" class="link" id="toggle-languages">Select all</button></div>
        <div class="choices" id="language-choices"></div>
      </div>
      <div class="field">
        <label class="label" for="run-name">Name</label>
        <input type="text" id="run-name" pattern="[A-Za-z0-9_.\-]+">
      </div>
      <div class="form-error" id="form-error" role="alert"></div>
      <button class="button primary wide" type="submit">Start run</button>
    </form>
    <nav class="box" aria-label="Runs">
      <h2 class="panel-title">Runs</h2>
      <div id="runs"></div>
    </nav>
  </div>
  <section>
    <div id="run"><div class="box empty">Start a run, or pick one on the left.</div></div>
    <div class="panels" id="panels" hidden>
      <div class="box">
        <h3 class="panel-title" id="failures-title">Failures</h3>
        <div class="failures" id="failures"></div>
      </div>
      <div class="box">
        <div class="output-head">
          <h3 class="panel-title" id="output-title">Output</h3>
          <label><input type="checkbox" id="follow" checked> Follow</label>
        </div>
        <div class="output-meta" id="output-meta">Pick a cell to see its output.</div>
        <pre class="log" id="log"></pre>
      </div>
    </div>
  </section>
</main>

<script>
const LANGUAGES = { DEU: "German", ESP: "Spanish", FRA: "French", ITA: "Italian", JPN: "Japanese", USA_EUR: "English" };
const STATUS = { queued: "Waiting", running: "Running", passed: "Passed", failed: "Failed", lost: "Lost", stopped: "Stopped", cancelled: "Cancelled" };
const state = { run: null, job: null, runs: [], meta: { modules: [], languages: [], max_processes: 8 }, formReady: false };

const escape = (text) => String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const languageName = (code) => LANGUAGES[code] || code;
const testName = (module) => {
  const name = module.replace(/^test_(mode_)?/, "").replaceAll("_", " ");
  return name.charAt(0).toUpperCase() + name.slice(1);
};
const duration = (seconds) => {
  seconds = Math.max(0, Math.round(seconds || 0));
  const minutes = Math.floor(seconds / 60);
  return minutes ? `${minutes} min ${String(seconds % 60).padStart(2, "0")} s` : `${seconds} s`;
};
const when = (timestamp) => new Date(timestamp * 1000).toLocaleString([], { dateStyle: "short", timeStyle: "short" });
const defaultName = (prefix) => `${prefix}-${new Date().toISOString().slice(5, 16).replace(/[-:T]/g, "")}`;
const getJson = async (url) => (await fetch(url)).json();
const remember = (key, value) => { try { localStorage.setItem(key, value); } catch (error) {} };
const recall = (key) => { try { return localStorage.getItem(key); } catch (error) { return null; } };

/* Theme */
document.getElementById("theme").addEventListener("click", () => {
  const current = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  remember("theme", next);
});

/* Processes: automatic (from this machine's CPU and free memory) until changed by hand */
const processes = document.getElementById("processes");
function showProcesses(value, automatic) {
  processes.value = Math.max(1, Math.min(64, value));
  document.getElementById("processes-label").textContent = automatic ? "Processes (auto)" : "Processes";
  document.getElementById("auto-processes").hidden = automatic;
}
function setProcesses(value) {
  showProcesses(value, false);
  remember("processes", processes.value);
}
document.getElementById("fewer").addEventListener("click", () => setProcesses(Number(processes.value) - 1));
document.getElementById("more").addEventListener("click", () => setProcesses(Number(processes.value) + 1));
document.getElementById("auto-processes").addEventListener("click", () => {
  try { localStorage.removeItem("processes"); } catch (error) {}
  showProcesses(state.meta.max_processes, true);
});

async function startRun(body) {
  const result = await (await fetch("/api/start", { method: "POST", body: JSON.stringify(body) })).json();
  if (result.error) return result.error;
  state.run = body.name;
  state.job = null;
  setTimeout(refresh, 800);
  return null;
}

document.getElementById("run-all").addEventListener("click", async () => {
  const error = await startRun({
    name: defaultName("all"),
    modules: state.meta.modules,
    languages: state.meta.languages,
    max_processes: Number(processes.value),
  });
  if (error) alert(error);
});

/* New run form */
function fillForm(fromRun) {
  const modules = new Set(fromRun ? fromRun.modules : []);
  const languages = new Set(fromRun ? fromRun.languages : state.meta.languages);
  document.getElementById("module-choices").innerHTML = state.meta.modules.map((m) =>
    `<label class="choice"><input type="checkbox" name="module" value="${escape(m)}" ${modules.has(m) ? "checked" : ""}><span>${escape(testName(m))}</span></label>`).join("");
  document.getElementById("language-choices").innerHTML = state.meta.languages.map((l) =>
    `<label class="choice"><input type="checkbox" name="language" value="${escape(l)}" ${languages.has(l) ? "checked" : ""}><span>${escape(languageName(l))}</span></label>`).join("");
  document.getElementById("run-name").value = fromRun ? fromRun.name : "";
  document.getElementById("run-name").placeholder = defaultName("run");
  document.getElementById("form-error").textContent = "";
}
function toggleAll(name) {
  const boxes = [...document.querySelectorAll(`input[name="${name}"]`)];
  const check = boxes.some((box) => !box.checked);
  boxes.forEach((box) => (box.checked = check));
}
document.getElementById("toggle-modules").addEventListener("click", () => toggleAll("module"));
document.getElementById("toggle-languages").addEventListener("click", () => toggleAll("language"));
document.getElementById("new-run").addEventListener("submit", async (event) => {
  event.preventDefault();
  const nameInput = document.getElementById("run-name");
  const error = await startRun({
    name: nameInput.value.trim() || nameInput.placeholder,
    modules: [...document.querySelectorAll('input[name="module"]:checked')].map((box) => box.value),
    languages: [...document.querySelectorAll('input[name="language"]:checked')].map((box) => box.value),
    max_processes: Number(processes.value),
  });
  document.getElementById("form-error").textContent = error || "";
  if (!error) nameInput.placeholder = defaultName("run");
});

/* Runs and the selected run */
function balls(job) {
  const done = job.progress.states;
  const queued = Math.max(0, job.progress.total - done.length);
  const html = done.map((s) => `<span class="ball ${s.status === "ok" ? "" : s.status}" title="${escape(s.name)}"></span>`);
  for (let i = 0; i < queued; i++) html.push('<span class="ball queued"></span>');
  if (!done.length && !queued && job.status === "running") html.push('<span class="ball running"></span>');
  return html.join("");
}

function counts(jobs) {
  const all = jobs.flatMap((job) => job.progress.states);
  return {
    pass: all.filter((s) => s.status === "ok").length,
    fail: all.filter((s) => s.status === "fail").length,
    skip: all.filter((s) => s.status === "skip").length,
  };
}

async function refreshRuns() {
  const data = await getJson("/api/runs");
  state.runs = data.runs;
  state.meta = data;
  const manual = Number(recall("processes"));
  showProcesses(manual || data.max_processes, !manual);
  if (!state.formReady) {
    fillForm(null);
    state.formReady = true;
  }
  const notice = document.getElementById("notice");
  notice.hidden = !data.error;
  notice.textContent = data.error || "";
  if (!state.run && data.runs.length) state.run = data.runs[0].name;
  document.getElementById("runs").innerHTML = data.runs.length
    ? data.runs.map((run) => {
        const total = Object.values(run.counts).reduce((a, b) => a + b, 0) || 1;
        const part = (status, color) => run.counts[status] ? `<span style="width:${(100 * run.counts[status]) / total}%;background:var(${color})"></span>` : "";
        return `<button class="run-item" data-run="${escape(run.name)}" aria-current="${run.name === state.run}">
          <span class="name">${escape(run.name)}</span>
          <span class="when">${run.done ? when(run.started) : "Running now"}</span>
          <span class="tally">${part("passed", "--pass")}${part("failed", "--fail")}${part("lost", "--fail")}${part("running", "--run")}</span>
        </button>`;
      }).join("")
    : '<div class="empty">No runs yet.</div>';
}

async function refreshRun() {
  if (!state.run) return;
  const run = await getJson(`/api/run?name=${encodeURIComponent(state.run)}`);
  if (run.error) {
    document.getElementById("run").innerHTML = `<div class="box empty">${escape(run.error)}</div>`;
    return;
  }
  const jobs = Object.fromEntries(run.jobs.map((job) => [job.id, job]));
  const tally = counts(run.jobs);
  const running = run.jobs.filter((job) => job.status === "running").length;
  const elapsed = (run.ended || run.now) - run.started;
  const status = run.done ? `Finished in ${duration(elapsed)}` : `${running} running, ${duration(elapsed)} so far`;

  let grid = `<table class="grid" style="min-width:${150 + run.languages.length * 130}px"><colgroup><col class="name">${run.languages.map(() => "<col>").join("")}</colgroup>`;
  grid += `<thead><tr><th></th>${run.languages.map((l) => `<th scope="col">${escape(languageName(l))}</th>`).join("")}</tr></thead><tbody>`;
  for (const module of run.modules) {
    grid += `<tr><th scope="row" title="${escape(module)}">${escape(testName(module))}</th>`;
    for (const language of run.languages) {
      const job = jobs[`${module}.${language}`];
      if (!job) {
        grid += '<td class="cell same"><div class="meta"><span>English states only</span></div></td>';
        continue;
      }
      const p = job.progress;
      const finished = p.states.filter((s) => s.status !== "running").length;
      const current = p.states.find((s) => s.status === "running");
      grid += `<td class="cell ${job.status}" tabindex="0" data-job="${escape(job.id)}" aria-selected="${job.id === state.job}"
        title="${escape(current ? `Now: ${current.name}` : STATUS[job.status] || job.status)}">
        <div class="balls">${balls(job)}</div>
        <div class="meta"><span class="word">${STATUS[job.status] || job.status}</span><span>${p.total ? `${finished}/${p.total}` : ""}</span></div>
      </td>`;
    }
    grid += "</tr>";
  }
  grid += "</tbody></table>";

  const canStop = !run.done && run.supervisor_alive;
  document.getElementById("run").innerHTML = `
    <div class="run-head">
      <h2>${escape(run.name)}</h2>
      <span class="state">${status}</span>
      <span class="counts"><span class="pass">${tally.pass} passed</span><span class="fail">${tally.fail} failed</span><span class="skip">${tally.skip} skipped</span></span>
      <span class="actions">
        ${canStop ? '<button class="button danger" id="stop-run">Stop run</button>' : ""}
        <button class="button" id="run-again">Run again</button>
      </span>
    </div>
    <div class="box grid-wrap">${grid}</div>
    <div class="legend">
      <span><span class="ball"></span>Passed</span><span><span class="ball fail"></span>Failed</span>
      <span><span class="ball skip"></span>Skipped</span><span><span class="ball running"></span>Running</span>
      <span><span class="ball queued"></span>Waiting</span>
    </div>`;

  const failures = run.jobs.flatMap((job) => job.progress.failures.map((f) => ({ ...f, job: job.id })));
  document.getElementById("panels").hidden = false;
  document.getElementById("failures-title").textContent = failures.length ? `Failures (${failures.length})` : "Failures";
  document.getElementById("failures").innerHTML = failures.length
    ? failures.map((f) => `<button class="failure" data-job="${escape(f.job)}"><div class="state">${escape(f.state)}</div><div class="error">${escape(f.error)}</div></button>`).join("")
    : `<div class="empty">${run.done ? "Nothing failed." : "Nothing failed so far."}</div>`;
  await refreshOutput(state.job ? jobs[state.job] : null);
}

async function refreshOutput(job) {
  const log = document.getElementById("log");
  if (!job) {
    document.getElementById("output-title").textContent = "Output";
    document.getElementById("output-meta").textContent = "Pick a cell to see its output.";
    log.textContent = "";
    return;
  }
  const text = await (await fetch(`/api/log?run=${encodeURIComponent(state.run)}&job=${encodeURIComponent(job.id)}&lines=800`)).text();
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  const current = job.progress.states.find((s) => s.status === "running");
  document.getElementById("output-title").textContent = `${testName(job.module)}, ${languageName(job.language)}`;
  const parts = [STATUS[job.status] || job.status];
  if (job.started) parts.push(duration((job.ended || Date.now() / 1000) - job.started));
  if (current) parts.push(`now on ${current.name}`);
  document.getElementById("output-meta").textContent = parts.join(", ");
  if (log.dataset.job !== job.id || log.textContent !== text) {
    const switched = log.dataset.job !== job.id;
    log.dataset.job = job.id;
    log.textContent = text || "No output yet.";
    if (switched || (document.getElementById("follow").checked && atBottom)) log.scrollTop = log.scrollHeight;
  }
}

async function refresh() {
  try {
    await refreshRuns();
    await refreshRun();
  } catch (error) {
    const notice = document.getElementById("notice");
    notice.hidden = false;
    notice.textContent = `Can't reach the dashboard server (${error.message}). Is dashboard.py still running?`;
  }
}

document.addEventListener("click", async (event) => {
  const runButton = event.target.closest("[data-run]");
  if (runButton) { state.run = runButton.dataset.run; state.job = null; refresh(); return; }
  const jobElement = event.target.closest("[data-job]");
  if (jobElement) { state.job = jobElement.dataset.job; refresh(); return; }
  if (event.target.id === "stop-run" && confirm(`Stop ${state.run}? Its running processes will be killed.`)) {
    await fetch("/api/stop", { method: "POST", body: JSON.stringify({ name: state.run }) });
    refresh();
  }
  if (event.target.id === "run-again") {
    fillForm(await getJson(`/api/run?name=${encodeURIComponent(state.run)}`));
    document.getElementById("new-run").scrollIntoView({ behavior: "smooth" });
    document.getElementById("run-name").focus();
  }
});
document.addEventListener("keydown", (event) => {
  const cell = event.target.closest && event.target.closest("td.cell[data-job]");
  if (cell && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); state.job = cell.dataset.job; refresh(); }
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
